name: Auto-Generate and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/settingsbookmarker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SettingsBookmarker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.settingsbookmarker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.settingsbookmarker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              // Zero external dependencies needed! Uses built-in Android SDK for 100% reliable builds.
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Settings Bookmarker"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.example.settingsbookmarker.OPEN_BOOKMARK" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SettingsNavigatorService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50"
              android:packageNames="com.android.settings" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/SettingsNavigatorService.kt
          package com.example.settingsbookmarker

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.LinkedList
          import java.util.Queue

          class SettingsNavigatorService : AccessibilityService() {

              companion object {
                  val clickQueue: Queue<String> = LinkedList()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (clickQueue.isEmpty()) return
                  val rootNode = rootInActiveWindow ?: return
                  val targetText = clickQueue.peek() ?: return

                  val matchingNodes = rootNode.findAccessibilityNodeInfosByText(targetText)
                  if (!matchingNodes.isNullOrEmpty()) {
                      for (node in matchingNodes) {
                          val clickableParent = findClickableParent(node)
                          if (clickableParent != null) {
                              clickQueue.poll()
                              clickableParent.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                              return
                          }
                      }
                  } else {
                      scrollDown(rootNode)
                  }
              }

              private fun findClickableParent(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current
                      current = current.parent
                  }
                  return null
              }

              private fun scrollDown(node: AccessibilityNodeInfo?) {
                  if (node == null) return
                  if (node.isScrollable) {
                      node.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      return
                  }
                  for (i in 0 until node.childCount) {
                      scrollDown(node.getChild(i))
                  }
              }

              override fun onInterrupt() {
                  clickQueue.clear()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/MainActivity.kt
          package com.example.settingsbookmarker

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          data class SettingBookmark(
              val id: String,
              val title: String,
              val baseAction: String,
              val subSteps: List<String> = emptyList()
          )

          class MainActivity : Activity() {

              private val bookmarks = mutableListOf(
                  SettingBookmark("display_direct", "Display Settings (Direct)", Settings.ACTION_DISPLAY_SETTINGS),
                  SettingBookmark("refresh_rate_deep", "Refresh Rate (Deep Step)", Settings.ACTION_DISPLAY_SETTINGS, listOf("Smooth Display")),
                  SettingBookmark("dev_options", "Developer Options", Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS),
                  SettingBookmark("battery_saver", "Battery Saver", Settings.ACTION_BATTERY_SAVER_SETTINGS),
                  SettingBookmark("wifi_settings", "Wi-Fi Settings", Settings.ACTION_WIFI_SETTINGS)
              )

              private lateinit var listContainer: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (intent?.action == "com.example.settingsbookmarker.OPEN_BOOKMARK") {
                      val baseAction = intent.getStringExtra("BASE_ACTION") ?: Settings.ACTION_SETTINGS
                      val stepsString = intent.getStringExtra("SUB_STEPS") ?: ""
                      val steps = if (stepsString.isNotEmpty()) stepsString.split("|") else emptyList()

                      executeBookmark(this, baseAction, steps)
                      finish()
                      return
                  }

                  loadCustomBookmarks()

                  val scrollView = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  scrollView.addView(root)

                  val accessBtn = Button(this).apply {
                      text = "1. Enable Accessibility (For Deep Steps)"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  root.addView(accessBtn)

                  val titleInput = EditText(this).apply {
                      hint = "Bookmark Name (e.g., Dark Mode Schedule)"
                  }
                  root.addView(titleInput)

                  val stepsInput = EditText(this).apply {
                      hint = "Exact Menu Text to Click (e.g., Dark theme, Schedule)"
                  }
                  root.addView(stepsInput)

                  val addBtn = Button(this).apply {
                      text = "Add Custom Display Sub-Setting Bookmark"
                      setOnClickListener {
                          val t = titleInput.text.toString().trim()
                          val s = stepsInput.text.toString().trim()
                          if (t.isNotEmpty() && s.isNotEmpty()) {
                              val newBm = SettingBookmark(
                                  id = "custom_${System.currentTimeMillis()}",
                                  title = t,
                                  baseAction = Settings.ACTION_DISPLAY_SETTINGS,
                                  subSteps = s.split(",").map { it.trim() }
                              )
                              bookmarks.add(newBm)
                              saveCustomBookmark(newBm)
                              titleInput.setText("")
                              stepsInput.setText("")
                              refreshList()
                          }
                      }
                  }
                  root.addView(addBtn)

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 30, 0, 0)
                  }
                  root.addView(listContainer)

                  refreshList()
                  setContentView(scrollView)
              }

              private fun refreshList() {
                  listContainer.removeAllViews()
                  for (item in bookmarks) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(30, 30, 30, 30)
                          setBackgroundColor(Color.parseColor("#F2F2F7"))
                          val params = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          params.setMargins(0, 0, 0, 24)
                          layoutParams = params
                      }

                      val titleView = TextView(this).apply {
                          text = item.title
                          textSize = 18f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.BLACK)
                      }
                      card.addView(titleView)

                      if (item.subSteps.isNotEmpty()) {
                          val subView = TextView(this).apply {
                              text = "Auto-clicks: ${item.subSteps.joinToString(" -> ")}"
                              textSize = 14f
                              setTextColor(Color.DKGRAY)
                          }
                          card.addView(subView)
                      }

                      val btnRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.START
                      }

                      val openBtn = Button(this).apply {
                          text = "Open Now"
                          setOnClickListener {
                              executeBookmark(this@MainActivity, item.baseAction, item.subSteps)
                          }
                      }
                      btnRow.addView(openBtn)

                      val pinBtn = Button(this).apply {
                          text = "Pin to Home"
                          setOnClickListener {
                              pinBookmarkToHomeScreen(this@MainActivity, item)
                          }
                      }
                      btnRow.addView(pinBtn)

                      card.addView(btnRow)
                      listContainer.addView(card)
                  }
              }

              private fun saveCustomBookmark(bm: SettingBookmark) {
                  val prefs = getSharedPreferences("bookmarks", Context.MODE_PRIVATE)
                  val existing = prefs.getStringSet("custom_list", mutableSetOf())?.toMutableSet() ?: mutableSetOf()
                  existing.add("${bm.id};;${bm.title};;${bm.baseAction};;${bm.subSteps.joinToString("|")}")
                  prefs.edit().putStringSet("custom_list", existing).apply()
              }

              private fun loadCustomBookmarks() {
                  val prefs = getSharedPreferences("bookmarks", Context.MODE_PRIVATE)
                  val existing = prefs.getStringSet("custom_list", emptySet()) ?: emptySet()
                  for (entry in existing) {
                      val parts = entry.split(";;")
                      if (parts.size == 4) {
                          val steps = if (parts[3].isNotEmpty()) parts[3].split("|") else emptyList()
                          bookmarks.add(SettingBookmark(parts[0], parts[1], parts[2], steps))
                      }
                  }
              }

              private fun executeBookmark(context: Context, baseAction: String, subSteps: List<String>) {
                  SettingsNavigatorService.clickQueue.clear()
                  SettingsNavigatorService.clickQueue.addAll(subSteps)

                  val launchIntent = Intent(baseAction).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  }
                  try {
                      context.startActivity(launchIntent)
                  } catch (e: Exception) {
                      Toast.makeText(context, "Setting not supported on this device", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun pinBookmarkToHomeScreen(context: Context, bookmark: SettingBookmark) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sm = context.getSystemService(ShortcutManager::class.java)
                      if (sm != null && sm.isRequestPinShortcutSupported) {
                          val shortcutIntent = Intent(context, MainActivity::class.java).apply {
                              action = "com.example.settingsbookmarker.OPEN_BOOKMARK"
                              putExtra("BASE_ACTION", bookmark.baseAction)
                              putExtra("SUB_STEPS", bookmark.subSteps.joinToString("|"))
                          }

                          val info = ShortcutInfo.Builder(context, bookmark.id)
                              .setShortLabel(bookmark.title)
                              .setLongLabel("Open ${bookmark.title}")
                              .setIcon(Icon.createWithResource(context, android.R.drawable.ic_menu_preferences))
                              .setIntent(shortcutIntent)
                              .build()

                          val cb = sm.createShortcutResultIntent(info)
                          val pending = PendingIntent.getBroadcast(context, 0, cb, PendingIntent.FLAG_IMMUTABLE)
                          sm.requestPinShortcut(info, pending.intentSender)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsBookmarker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
