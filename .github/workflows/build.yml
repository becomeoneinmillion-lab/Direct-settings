name: Build Banking-Safe Settings Bookmarker

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Banking-Safe Project Files
        run: |
          rm -rf app/src/main
          mkdir -p app/src/main/java/com/example/settingsbookmarker

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SettingsBookmarker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.settingsbookmarker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.settingsbookmarker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0-BankingSafe"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- ONLY standard shortcut and query permissions. ZERO Accessibility permissions! -->
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />

              <!-- Allows discovering all direct sub-settings screens built into your phone -->
              <queries>
                  <package android:name="com.android.settings" />
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:label="Settings Bookmarker"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.example.settingsbookmarker.OPEN_BOOKMARK" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/MainActivity.kt
          package com.example.settingsbookmarker

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.widget.*

          data class SettingTarget(
              val label: String,
              val actionOrComponent: String,
              val isComponent: Boolean
          )

          data class SettingBookmark(
              val id: String,
              val title: String,
              val targetLabel: String,
              val actionOrComponent: String,
              val isComponent: Boolean
          )

          class MainActivity : Activity() {

              private val availableTargets = mutableListOf<SettingTarget>()
              private val bookmarks = mutableListOf<SettingBookmark>()
              private lateinit var listContainer: LinearLayout

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (intent?.action == "com.example.settingsbookmarker.OPEN_BOOKMARK") {
                      val target = intent.getStringExtra("TARGET") ?: Settings.ACTION_SETTINGS
                      val isComp = intent.getBooleanExtra("IS_COMP", false)
                      launchSetting(this, target, isComp)
                      finish()
                      return
                  }

                  discoverAllSystemSettings()
                  loadBookmarks()

                  val scrollView = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  scrollView.addView(root)

                  val safeBanner = TextView(this).apply {
                      text = "✓ Banking & UPI Safe Mode (Zero Accessibility Permissions)"
                      setBackgroundColor(Color.parseColor("#D1F2D9"))
                      setTextColor(Color.parseColor("#0A5C20"))
                      setTypeface(null, Typeface.BOLD)
                      setPadding(24, 24, 24, 24)
                  }
                  root.addView(safeBanner)

                  val sectionLabel = TextView(this).apply {
                      text = "Create Direct Settings Bookmark"
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 24, 0, 12)
                  }
                  root.addView(sectionLabel)

                  val titleInput = EditText(this).apply {
                      hint = "1. Custom Bookmark Name (e.g., Hotspot, Night Light)"
                  }
                  root.addView(titleInput)

                  val spinnerLabel = TextView(this).apply {
                      text = "2. Choose Deep System Setting Screen (${availableTargets.size} found on your phone):"
                      setPadding(0, 16, 0, 6)
                  }
                  root.addView(spinnerLabel)

                  val targetSpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          availableTargets.map { it.label }
                      )
                  }
                  root.addView(targetSpinner)

                  val addBtn = Button(this).apply {
                      text = "+ Save Direct Bookmark"
                      setOnClickListener {
                          val chosen = availableTargets[targetSpinner.selectedItemPosition]
                          val customTitle = titleInput.text.toString().trim().ifEmpty { chosen.label }

                          val newBm = SettingBookmark(
                              id = "bm_${System.currentTimeMillis()}",
                              title = customTitle,
                              targetLabel = chosen.label,
                              actionOrComponent = chosen.actionOrComponent,
                              isComponent = chosen.isComponent
                          )
                          bookmarks.add(0, newBm)
                          saveAllBookmarks()
                          titleInput.setText("")
                          refreshList()
                          Toast.makeText(this@MainActivity, "Bookmark Added!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  root.addView(addBtn)

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 32, 0, 0)
                  }
                  root.addView(listContainer)

                  refreshList()
                  setContentView(scrollView)
              }

              private fun discoverAllSystemSettings() {
                  // 1. Add standard Android Settings Deep Intents
                  val standardActions = listOf(
                      "Display Settings" to Settings.ACTION_DISPLAY_SETTINGS,
                      "Night Light / Eye Comfort" to Settings.ACTION_NIGHT_DISPLAY_SETTINGS,
                      "Auto-Rotate / Accessibility Display" to Settings.ACTION_ACCESSIBILITY_SETTINGS,
                      "Sound & Vibration" to Settings.ACTION_SOUND_SETTINGS,
                      "Do Not Disturb (DND) Rules" to Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS,
                      "Wi-Fi Settings" to Settings.ACTION_WIFI_SETTINGS,
                      "Wi-Fi IP / Saved Networks" to Settings.ACTION_WIFI_IP_SETTINGS,
                      "Mobile Data & SIM / Roaming" to Settings.ACTION_DATA_ROAMING_SETTINGS,
                      "Data Usage Summary" to Settings.ACTION_DATA_USAGE_SETTINGS,
                      "Airplane / Wireless & Hotspot" to Settings.ACTION_WIRELESS_SETTINGS,
                      "VPN Settings" to Settings.ACTION_VPN_SETTINGS,
                      "Bluetooth Devices" to Settings.ACTION_BLUETOOTH_SETTINGS,
                      "NFC & Contactless Payments" to Settings.ACTION_NFC_SETTINGS,
                      "Cast / Screen Mirroring" to Settings.ACTION_CAST_SETTINGS,
                      "Battery Saver" to Settings.ACTION_BATTERY_SAVER_SETTINGS,
                      "Apps List (Manage All Apps)" to Settings.ACTION_APPLICATION_SETTINGS,
                      "Default Apps (Browser, Phone, etc.)" to Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS,
                      "Notification History & Access" to Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS,
                      "Display Over Other Apps Permission" to Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                      "Modify System Settings Permission" to Settings.ACTION_MANAGE_WRITE_SETTINGS,
                      "Install Unknown Apps Permission" to Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                      "Storage & Internal Space" to Settings.ACTION_INTERNAL_STORAGE_SETTINGS,
                      "Security & Lock Screen" to Settings.ACTION_SECURITY_SETTINGS,
                      "Biometrics / Fingerprint Enroll" to Settings.ACTION_BIOMETRIC_ENROLL,
                      "Privacy Dashboard" to Settings.ACTION_PRIVACY_SETTINGS,
                      "Location & GPS" to Settings.ACTION_LOCATION_SOURCE_SETTINGS,
                      "Passwords & Autofill" to Settings.ACTION_REQUEST_SET_AUTOFILL_SERVICE,
                      "Accounts & Sync" to Settings.ACTION_SYNC_SETTINGS,
                      "Date & Time" to Settings.ACTION_DATE_SETTINGS,
                      "Language & Region" to Settings.ACTION_LOCALE_SETTINGS,
                      "Keyboards & Input Methods" to Settings.ACTION_INPUT_METHOD_SETTINGS,
                      "Developer Options" to Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS,
                      "Device Info / About Phone" to Settings.ACTION_DEVICE_INFO_SETTINGS
                  )

                  for ((label, action) in standardActions) {
                      availableTargets.add(SettingTarget(label, action, false))
                  }

                  // 2. Scan the phone's built-in com.android.settings package for ALL exported deep sub-screens!
                  try {
                      val pkgInfo = packageManager.getPackageInfo(
                          "com.android.settings",
                          PackageManager.GET_ACTIVITIES
                      )
                      val activities = pkgInfo.activities ?: emptyArray()
                      for (act in activities) {
                          if (act.exported && (act.permission == null || act.permission.isEmpty())) {
                              val rawLabel = act.loadLabel(packageManager)?.toString()?.trim() ?: ""
                              val shortClass = act.name.substringAfterLast(".").substringAfterLast("$")
                              val displayLabel = if (rawLabel.isNotEmpty() && rawLabel != "Settings") {
                                  "Deep Screen: $rawLabel ($shortClass)"
                              } else {
                                  "Deep Screen: $shortClass"
                              }
                              availableTargets.add(
                                  SettingTarget(
                                      label = displayLabel,
                                      actionOrComponent = "${act.packageName}/${act.name}",
                                      isComponent = true
                                  )
                              )
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun launchSetting(context: Context, target: String, isComponent: Boolean) {
                  try {
                      val launchIntent = if (isComponent) {
                          val parts = target.split("/")
                          Intent(Intent.ACTION_MAIN).apply {
                              component = ComponentName(parts[0], parts[1])
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                      } else {
                          Intent(target).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                      }
                      context.startActivity(launchIntent)
                  } catch (e: Exception) {
                      Toast.makeText(context, "This sub-screen cannot be opened directly on your phone model", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun refreshList() {
                  listContainer.removeAllViews()
                  for (item in bookmarks) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(30, 30, 30, 30)
                          setBackgroundColor(Color.parseColor("#F2F2F7"))
                          val params = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          params.setMargins(0, 0, 0, 24)
                          layoutParams = params
                      }

                      val titleView = TextView(this).apply {
                          text = item.title
                          textSize = 18f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.BLACK)
                      }
                      card.addView(titleView)

                      val subView = TextView(this).apply {
                          text = item.targetLabel
                          textSize = 13f
                          setTextColor(Color.DKGRAY)
                      }
                      card.addView(subView)

                      val btnRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.START
                      }

                      val openBtn = Button(this).apply {
                          text = "Open Now"
                          setOnClickListener {
                              launchSetting(this@MainActivity, item.actionOrComponent, item.isComponent)
                          }
                      }
                      btnRow.addView(openBtn)

                      val pinBtn = Button(this).apply {
                          text = "Pin to Home"
                          setOnClickListener {
                              pinBookmarkToHomeScreen(this@MainActivity, item)
                          }
                      }
                      btnRow.addView(pinBtn)

                      val delBtn = Button(this).apply {
                          text = "Delete"
                          setOnClickListener {
                              bookmarks.remove(item)
                              saveAllBookmarks()
                              refreshList()
                          }
                      }
                      btnRow.addView(delBtn)

                      card.addView(btnRow)
                      listContainer.addView(card)
                  }
              }

              private fun saveAllBookmarks() {
                  val prefs = getSharedPreferences("bookmarks_v3_safe", Context.MODE_PRIVATE)
                  val serialized = bookmarks.joinToString("####") { bm ->
                      "${bm.id};;${bm.title};;${bm.targetLabel};;${bm.actionOrComponent};;${bm.isComponent}"
                  }
                  prefs.edit().putString("saved_list", serialized).apply()
              }

              private fun loadBookmarks() {
                  val prefs = getSharedPreferences("bookmarks_v3_safe", Context.MODE_PRIVATE)
                  val saved = prefs.getString("saved_list", null)
                  bookmarks.clear()

                  if (saved == null) {
                      bookmarks.addAll(
                          listOf(
                              SettingBookmark("night_light", "Night Light / Eye Care", "Night Light / Eye Comfort", Settings.ACTION_NIGHT_DISPLAY_SETTINGS, false),
                              SettingBookmark("display_direct", "Display Settings", "Display Settings", Settings.ACTION_DISPLAY_SETTINGS, false),
                              SettingBookmark("dev_options", "Developer Options", "Developer Options", Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS, false),
                              SettingBookmark("hotspot_wireless", "Hotspot & Network", "Airplane / Wireless & Hotspot", Settings.ACTION_WIRELESS_SETTINGS, false)
                          )
                      )
                      saveAllBookmarks()
                  } else if (saved.isNotEmpty()) {
                      for (entry in saved.split("####")) {
                          val parts = entry.split(";;")
                          if (parts.size == 5) {
                              bookmarks.add(
                                  SettingBookmark(parts[0], parts[1], parts[2], parts[3], parts[4].toBoolean())
                              )
                          }
                      }
                  }
              }

              private fun pinBookmarkToHomeScreen(context: Context, bookmark: SettingBookmark) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sm = context.getSystemService(ShortcutManager::class.java)
                      if (sm != null && sm.isRequestPinShortcutSupported) {
                          val shortcutIntent = Intent(context, MainActivity::class.java).apply {
                              action = "com.example.settingsbookmarker.OPEN_BOOKMARK"
                              putExtra("TARGET", bookmark.actionOrComponent)
                              putExtra("IS_COMP", bookmark.isComponent)
                          }

                          val info = ShortcutInfo.Builder(context, bookmark.id)
                              .setShortLabel(bookmark.title)
                              .setLongLabel("Open ${bookmark.title}")
                              .setIcon(Icon.createWithResource(context, android.R.drawable.ic_menu_preferences))
                              .setIntent(shortcutIntent)
                              .build()

                          val cb = sm.createShortcutResultIntent(info)
                          val pending = PendingIntent.getBroadcast(context, 0, cb, PendingIntent.FLAG_IMMUTABLE)
                          sm.requestPinShortcut(info, pending.intentSender)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsBookmarker-BankingSafe-APK
          path: app/build/outputs/apk/debug/app-debug.apk
