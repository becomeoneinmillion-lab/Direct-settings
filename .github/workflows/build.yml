name: Auto-Generate and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/settingsbookmarker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SettingsBookmarker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.settingsbookmarker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.settingsbookmarker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Settings Bookmarker"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.example.settingsbookmarker.OPEN_BOOKMARK" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SettingsNavigatorService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews|flagReportViewIds"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="100" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/SettingsNavigatorService.kt
          package com.example.settingsbookmarker

          import android.accessibilityservice.AccessibilityService
          import android.os.Handler
          import android.os.Looper
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.LinkedList
          import java.util.Queue

          class SettingsNavigatorService : AccessibilityService() {

              companion object {
                  val clickQueue: Queue<String> = LinkedList()
                  var isProcessing = false
                  var scrollAttempts = 0
                  private val handler = Handler(Looper.getMainLooper())

                  fun startNavigation(steps: List<String>) {
                      handler.removeCallbacksAndMessages(null)
                      clickQueue.clear()
                      clickQueue.addAll(steps)
                      scrollAttempts = 0
                      isProcessing = false

                      // Clear queue after 12 seconds so stale clicks never stay stuck
                      handler.postDelayed({
                          clickQueue.clear()
                          isProcessing = false
                      }, 12000)
                  }
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (clickQueue.isEmpty() || isProcessing) return

                  val pkg = event?.packageName?.toString() ?: ""
                  // Ignore events from our own app or launcher so we only click inside Settings
                  if (pkg == "com.example.settingsbookmarker" || pkg.contains("launcher")) return

                  isProcessing = true
                  handler.postDelayed({
                      processNextStep()
                  }, 350)
              }

              private fun processNextStep() {
                  if (clickQueue.isEmpty()) {
                      isProcessing = false
                      return
                  }

                  val rootNode = rootInActiveWindow
                  if (rootNode == null) {
                      isProcessing = false
                      return
                  }

                  val targetText = clickQueue.peek()?.trim() ?: ""
                  if (targetText.isEmpty()) {
                      clickQueue.poll()
                      isProcessing = false
                      return
                  }

                  val matchedNode = findNodeByTextCaseInsensitive(rootNode, targetText)
                  if (matchedNode != null) {
                      val clickableParent = findClickableParent(matchedNode)
                      if (clickableParent != null) {
                          clickQueue.poll()
                          scrollAttempts = 0
                          clickableParent.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                          // Wait briefly for the next sub-screen to open before looking for the next step
                          handler.postDelayed({
                              isProcessing = false
                              if (clickQueue.isNotEmpty()) processNextStep()
                          }, 550)
                          return
                      }
                  }

                  // If not visible on screen yet, scroll down up to 8 times
                  if (scrollAttempts < 8) {
                      scrollAttempts++
                      scrollDown(rootNode)
                      handler.postDelayed({
                          isProcessing = false
                          processNextStep()
                      }, 450)
                  } else {
                      // Could not find target after scrolling
                      clickQueue.clear()
                      isProcessing = false
                  }
              }

              private fun findNodeByTextCaseInsensitive(node: AccessibilityNodeInfo?, target: String): AccessibilityNodeInfo? {
                  if (node == null) return null

                  val nodeText = node.text?.toString() ?: ""
                  val nodeDesc = node.contentDescription?.toString() ?: ""

                  if (nodeText.equals(target, ignoreCase = true) ||
                      nodeDesc.equals(target, ignoreCase = true) ||
                      nodeText.contains(target, ignoreCase = true)) {
                      return node
                  }

                  for (i in 0 until node.childCount) {
                      val found = findNodeByTextCaseInsensitive(node.getChild(i), target)
                      if (found != null) return found
                  }
                  return null
              }

              private fun findClickableParent(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current
                      current = current.parent
                  }
                  return null
              }

              private fun scrollDown(node: AccessibilityNodeInfo?): Boolean {
                  if (node == null) return false
                  if (node.isScrollable) {
                      node.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      return true
                  }
                  for (i in 0 until node.childCount) {
                      if (scrollDown(node.getChild(i))) return true
                  }
                  return false
              }

              override fun onInterrupt() {
                  clickQueue.clear()
                  isProcessing = false
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/MainActivity.kt
          package com.example.settingsbookmarker

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.text.TextUtils
          import android.view.Gravity
          import android.widget.*

          data class SettingBookmark(
              val id: String,
              val title: String,
              val categoryLabel: String,
              val baseAction: String,
              val subSteps: List<String> = emptyList()
          )

          class MainActivity : Activity() {

              private val baseCategories = listOf(
                  "Main Settings (Start from Top)" to Settings.ACTION_SETTINGS,
                  "Display Settings" to Settings.ACTION_DISPLAY_SETTINGS,
                  "Sound & Vibration" to Settings.ACTION_SOUND_SETTINGS,
                  "Apps List (All Apps)" to Settings.ACTION_APPLICATION_SETTINGS,
                  "Wi-Fi Settings" to Settings.ACTION_WIFI_SETTINGS,
                  "Network & Internet / SIM" to Settings.ACTION_WIRELESS_SETTINGS,
                  "Bluetooth Settings" to Settings.ACTION_BLUETOOTH_SETTINGS,
                  "Connected Devices / Cast" to Settings.ACTION_CAST_SETTINGS,
                  "Battery Saver / Battery" to Settings.ACTION_BATTERY_SAVER_SETTINGS,
                  "Storage Settings" to Settings.ACTION_INTERNAL_STORAGE_SETTINGS,
                  "Security & Lock Screen" to Settings.ACTION_SECURITY_SETTINGS,
                  "Privacy Settings" to Settings.ACTION_PRIVACY_SETTINGS,
                  "Location Settings" to Settings.ACTION_LOCATION_SOURCE_SETTINGS,
                  "Accessibility Settings" to Settings.ACTION_ACCESSIBILITY_SETTINGS,
                  "Developer Options" to Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS,
                  "Date & Time" to Settings.ACTION_DATE_SETTINGS,
                  "Language & Input" to Settings.ACTION_LOCALE_SETTINGS
              )

              private val bookmarks = mutableListOf<SettingBookmark>()
              private lateinit var listContainer: LinearLayout
              private lateinit var statusBanner: Button

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (intent?.action == "com.example.settingsbookmarker.OPEN_BOOKMARK") {
                      val baseAction = intent.getStringExtra("BASE_ACTION") ?: Settings.ACTION_SETTINGS
                      val stepsString = intent.getStringExtra("SUB_STEPS") ?: ""
                      val steps = if (stepsString.isNotEmpty()) stepsString.split("|") else emptyList()

                      executeBookmark(this, baseAction, steps)
                      finish()
                      return
                  }

                  loadBookmarks()

                  val scrollView = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  scrollView.addView(root)

                  statusBanner = Button(this).apply {
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }
                  }
                  root.addView(statusBanner)

                  val sectionLabel = TextView(this).apply {
                      text = "Create New Settings Bookmark"
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 24, 0, 12)
                  }
                  root.addView(sectionLabel)

                  val titleInput = EditText(this).apply {
                      hint = "1. Bookmark Name (e.g., Hotspot or Dark Theme)"
                  }
                  root.addView(titleInput)

                  val spinnerLabel = TextView(this).apply {
                      text = "2. Select Starting Settings Screen:"
                      setPadding(0, 16, 0, 6)
                  }
                  root.addView(spinnerLabel)

                  val categorySpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          baseCategories.map { it.first }
                      )
                  }
                  root.addView(categorySpinner)

                  val stepsInput = EditText(this).apply {
                      hint = "3. Sub-options to auto-click (optional, comma-separated)"
                  }
                  root.addView(stepsInput)

                  val helperText = TextView(this).apply {
                      text = "Tip: Leave box #3 empty to just open the screen in #2 directly. Or enter exact menu words separated by commas (e.g., Hotspot & tethering, Wi-Fi hotspot) to auto-click deeper."
                      textSize = 12f
                      setTextColor(Color.DKGRAY)
                      setPadding(0, 0, 0, 16)
                  }
                  root.addView(helperText)

                  val addBtn = Button(this).apply {
                      text = "+ Save New Bookmark"
                      setOnClickListener {
                          val t = titleInput.text.toString().trim()
                          val s = stepsInput.text.toString().trim()
                          val selectedIndex = categorySpinner.selectedItemPosition
                          val selectedCategory = baseCategories[selectedIndex]

                          if (t.isEmpty()) {
                              Toast.makeText(this@MainActivity, "Please enter a Bookmark Name", Toast.LENGTH_SHORT).show()
                              return@setOnClickListener
                          }

                          val parsedSteps = if (s.isNotEmpty()) {
                              s.split(",").map { it.trim() }.filter { it.isNotEmpty() }
                          } else {
                              emptyList()
                          }

                          val newBm = SettingBookmark(
                              id = "bm_${System.currentTimeMillis()}",
                              title = t,
                              categoryLabel = selectedCategory.first,
                              baseAction = selectedCategory.second,
                              subSteps = parsedSteps
                          )
                          bookmarks.add(0, newBm)
                          saveAllBookmarks()
                          titleInput.setText("")
                          stepsInput.setText("")
                          refreshList()
                          Toast.makeText(this@MainActivity, "Bookmark Saved!", Toast.LENGTH_SHORT).show()
                      }
                  }
                  root.addView(addBtn)

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 32, 0, 0)
                  }
                  root.addView(listContainer)

                  refreshList()
                  setContentView(scrollView)
              }

              override fun onResume() {
                  super.onResume()
                  if (::statusBanner.isInitialized) {
                      val enabled = isAccessibilityServiceEnabled()
                      if (enabled) {
                          statusBanner.text = "✓ Deep Auto-Click Accessibility is ON"
                          statusBanner.setBackgroundColor(Color.parseColor("#D1F2D9"))
                      } else {
                          statusBanner.text = "⚠️ Tap Here to Enable Accessibility (Required for Sub-Steps)"
                          statusBanner.setBackgroundColor(Color.parseColor("#FFD6D6"))
                      }
                  }
              }

              private fun isAccessibilityServiceEnabled(): Boolean {
                  val expectedComponentName = "$packageName/${SettingsNavigatorService::class.java.canonicalName}"
                  val enabledServices = Settings.Secure.getString(
                      contentResolver,
                      Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES
                  ) ?: return false
                  val splitter = TextUtils.SimpleStringSplitter(':')
                  splitter.setString(enabledServices)
                  while (splitter.hasNext()) {
                      if (splitter.next().equals(expectedComponentName, ignoreCase = true)) {
                          return true
                      }
                  }
                  return false
              }

              private fun refreshList() {
                  listContainer.removeAllViews()
                  for (item in bookmarks) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(30, 30, 30, 30)
                          setBackgroundColor(Color.parseColor("#F2F2F7"))
                          val params = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          params.setMargins(0, 0, 0, 24)
                          layoutParams = params
                      }

                      val titleView = TextView(this).apply {
                          text = item.title
                          textSize = 18f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.BLACK)
                      }
                      card.addView(titleView)

                      val catView = TextView(this).apply {
                          text = "Starts at: ${item.categoryLabel}"
                          textSize = 13f
                          setTextColor(Color.DKGRAY)
                      }
                      card.addView(catView)

                      if (item.subSteps.isNotEmpty()) {
                          val subView = TextView(this).apply {
                              text = "Auto-clicks: ${item.subSteps.joinToString(" -> ")}"
                              textSize = 14f
                              setTextColor(Color.parseColor("#0055AA"))
                          }
                          card.addView(subView)
                      }

                      val btnRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.START
                      }

                      val openBtn = Button(this).apply {
                          text = "Open Now"
                          setOnClickListener {
                              executeBookmark(this@MainActivity, item.baseAction, item.subSteps)
                          }
                      }
                      btnRow.addView(openBtn)

                      val pinBtn = Button(this).apply {
                          text = "Pin to Home"
                          setOnClickListener {
                              pinBookmarkToHomeScreen(this@MainActivity, item)
                          }
                      }
                      btnRow.addView(pinBtn)

                      val delBtn = Button(this).apply {
                          text = "Delete"
                          setOnClickListener {
                              bookmarks.remove(item)
                              saveAllBookmarks()
                              refreshList()
                          }
                      }
                      btnRow.addView(delBtn)

                      card.addView(btnRow)
                      listContainer.addView(card)
                  }
              }

              private fun saveAllBookmarks() {
                  val prefs = getSharedPreferences("bookmarks_v2", Context.MODE_PRIVATE)
                  val serialized = bookmarks.joinToString("####") { bm ->
                      "${bm.id};;${bm.title};;${bm.categoryLabel};;${bm.baseAction};;${bm.subSteps.joinToString("|")}"
                  }
                  prefs.edit().putString("saved_list", serialized).apply()
              }

              private fun loadBookmarks() {
                  val prefs = getSharedPreferences("bookmarks_v2", Context.MODE_PRIVATE)
                  val saved = prefs.getString("saved_list", null)
                  bookmarks.clear()

                  if (saved == null) {
                      bookmarks.addAll(
                          listOf(
                              SettingBookmark("display_direct", "Display Settings", "Display Settings", Settings.ACTION_DISPLAY_SETTINGS),
                              SettingBookmark("dev_options", "Developer Options", "Developer Options", Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS),
                              SettingBookmark("battery_saver", "Battery Saver", "Battery Saver / Battery", Settings.ACTION_BATTERY_SAVER_SETTINGS),
                              SettingBookmark("wifi_settings", "Wi-Fi Settings", "Wi-Fi Settings", Settings.ACTION_WIFI_SETTINGS)
                          )
                      )
                      saveAllBookmarks()
                  } else if (saved.isNotEmpty()) {
                      val entries = saved.split("####")
                      for (entry in entries) {
                          val parts = entry.split(";;")
                          if (parts.size == 5) {
                              val steps = if (parts[4].isNotEmpty()) parts[4].split("|") else emptyList()
                              bookmarks.add(SettingBookmark(parts[0], parts[1], parts[2], parts[3], steps))
                          }
                      }
                  }
              }

              private fun executeBookmark(context: Context, baseAction: String, subSteps: List<String>) {
                  if (subSteps.isNotEmpty() && !isAccessibilityServiceEnabled()) {
                      Toast.makeText(
                          context,
                          "Please enable 'Settings Bookmarker' in Accessibility first so it can auto-click sub-steps!",
                          Toast.LENGTH_LONG
                      ).show()
                      context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      return
                  }

                  SettingsNavigatorService.startNavigation(subSteps)

                  val launchIntent = Intent(baseAction).apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
                  }
                  try {
                      context.startActivity(launchIntent)
                  } catch (e: Exception) {
                      Toast.makeText(context, "Setting not supported on this device", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun pinBookmarkToHomeScreen(context: Context, bookmark: SettingBookmark) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sm = context.getSystemService(ShortcutManager::class.java)
                      if (sm != null && sm.isRequestPinShortcutSupported) {
                          val shortcutIntent = Intent(context, MainActivity::class.java).apply {
                              action = "com.example.settingsbookmarker.OPEN_BOOKMARK"
                              putExtra("BASE_ACTION", bookmark.baseAction)
                              putExtra("SUB_STEPS", bookmark.subSteps.joinToString("|"))
                          }

                          val info = ShortcutInfo.Builder(context, bookmark.id)
                              .setShortLabel(bookmark.title)
                              .setLongLabel("Open ${bookmark.title}")
                              .setIcon(Icon.createWithResource(context, android.R.drawable.ic_menu_preferences))
                              .setIntent(shortcutIntent)
                              .build()

                          val cb = sm.createShortcutResultIntent(info)
                          val pending = PendingIntent.getBroadcast(context, 0, cb, PendingIntent.FLAG_IMMUTABLE)
                          sm.requestPinShortcut(info, pending.intentSender)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsBookmarker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
