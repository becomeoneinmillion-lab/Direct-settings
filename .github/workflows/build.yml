name: Build Settings Bookmarker V4

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Clean Project From Scratch
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/example/settingsbookmarker

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SettingsBookmarkerV4"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.settingsbookmarker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.settingsbookmarker.v4"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 4
                  versionName = "4.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />

              <queries>
                  <package android:name="com.android.settings" />
              </queries>

              <application
                  android:allowBackup="false"
                  android:label="Settings Bookmarker V4"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="settingsbm" />
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/MainActivity.kt
          package com.example.settingsbookmarker

          import android.app.Activity
          import android.app.PendingIntent
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Icon
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.View
          import android.widget.*

          data class SettingTarget(
              val label: String,
              val targetUri: String
          )

          data class SettingBookmark(
              val id: String,
              val title: String,
              val targetLabel: String,
              val targetUri: String
          )

          class MainActivity : Activity() {

              private val availableTargets = mutableListOf<SettingTarget>()
              private val bookmarks = mutableListOf<SettingBookmark>()
              private lateinit var listContainer: LinearLayout
              private var selectedTargetIndex = 0

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  // Handle Home Screen Shortcut clicks via unique URI data (never cached/lost)
                  if (intent?.action == Intent.ACTION_VIEW && intent?.data?.scheme == "settingsbm") {
                      val encodedTarget = intent.data?.getQueryParameter("target") ?: ""
                      if (encodedTarget.isNotEmpty()) {
                          launchSettingByUri(this, encodedTarget)
                      }
                      finish()
                      return
                  }

                  discoverSystemSettings()
                  loadBookmarks()

                  val scrollView = ScrollView(this)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 40, 40, 40)
                  }
                  scrollView.addView(root)

                  val safeBanner = TextView(this).apply {
                      text = "✓ V4 Direct Launcher (Banking/UPI Safe - No Accessibility)"
                      setBackgroundColor(Color.parseColor("#D1F2D9"))
                      setTextColor(Color.parseColor("#0A5C20"))
                      setTypeface(null, Typeface.BOLD)
                      setPadding(24, 24, 24, 24)
                  }
                  root.addView(safeBanner)

                  // Quick 1-Tap Preset Button specifically for Apps -> App Manager
                  val quickAppMgrBtn = Button(this).apply {
                      text = "⚡ Open Apps -> App Manager Now"
                      setBackgroundColor(Color.parseColor("#0055AA"))
                      setTextColor(Color.WHITE)
                      setOnClickListener {
                          openAppManagerDirectly(this@MainActivity)
                      }
                  }
                  val quickParams = LinearLayout.LayoutParams(
                      LinearLayout.LayoutParams.MATCH_PARENT,
                      LinearLayout.LayoutParams.WRAP_CONTENT
                  ).apply { setMargins(0, 24, 0, 12) }
                  root.addView(quickAppMgrBtn, quickParams)

                  val sectionLabel = TextView(this).apply {
                      text = "Add New Settings Bookmark"
                      textSize = 18f
                      setTypeface(null, Typeface.BOLD)
                      setPadding(0, 24, 0, 12)
                  }
                  root.addView(sectionLabel)

                  val spinnerLabel = TextView(this).apply {
                      text = "1. Select Setting Screen (${availableTargets.size} available):"
                      setPadding(0, 8, 0, 6)
                  }
                  root.addView(spinnerLabel)

                  val titleInput = EditText(this).apply {
                      hint = "2. Custom Name (Optional)"
                  }

                  val targetSpinner = Spinner(this).apply {
                      adapter = ArrayAdapter(
                          this@MainActivity,
                          android.R.layout.simple_spinner_dropdown_item,
                          availableTargets.map { it.label }
                      )
                      onItemSelectedListener = object : AdapterView.OnItemSelectedListener {
                          override fun onItemSelected(parent: AdapterView<*>?, view: View?, position: Int, id: Long) {
                              selectedTargetIndex = position
                              titleInput.hint = "2. Custom Name (Default: ${availableTargets[position].label})"
                          }
                          override fun onNothingSelected(parent: AdapterView<*>?) {}
                      }
                  }
                  root.addView(targetSpinner)
                  root.addView(titleInput)

                  val addBtn = Button(this).apply {
                      text = "+ Save Bookmark to List"
                      setOnClickListener {
                          val chosen = availableTargets[selectedTargetIndex]
                          val customTitle = titleInput.text.toString().trim().ifEmpty { chosen.label }

                          val newBm = SettingBookmark(
                              id = "bm_${System.currentTimeMillis()}",
                              title = customTitle,
                              targetLabel = chosen.label,
                              targetUri = chosen.targetUri
                          )
                          bookmarks.add(0, newBm)
                          saveAllBookmarks()
                          titleInput.setText("")
                          refreshList()
                          Toast.makeText(this@MainActivity, "Added: $customTitle", Toast.LENGTH_SHORT).show()
                      }
                  }
                  root.addView(addBtn)

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, 32, 0, 0)
                  }
                  root.addView(listContainer)

                  refreshList()
                  setContentView(scrollView)
              }

              private fun discoverSystemSettings() {
                  // Put Apps -> App Manager right at #1
                  val standardActions = listOf(
                      "Apps -> App Manager (Manage All Apps)" to "action:${Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS}",
                      "Apps -> App Settings List" to "action:${Settings.ACTION_APPLICATION_SETTINGS}",
                      "Apps -> Default Apps (Browser, Phone)" to "action:${Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS}",
                      "Apps -> Usage Access" to "action:${Settings.ACTION_USAGE_ACCESS_SETTINGS}",
                      "Apps -> Overlay (Appear on Top)" to "action:${Settings.ACTION_MANAGE_OVERLAY_PERMISSION}",
                      "Apps -> Modify System Settings" to "action:${Settings.ACTION_MANAGE_WRITE_SETTINGS}",
                      "Apps -> Notification Access" to "action:${Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS}",
                      "Wi-Fi Settings" to "action:${Settings.ACTION_WIFI_SETTINGS}",
                      "Hotspot & Wireless Settings" to "action:${Settings.ACTION_WIRELESS_SETTINGS}",
                      "Mobile Data / SIM Roaming" to "action:${Settings.ACTION_DATA_ROAMING_SETTINGS}",
                      "Data Usage" to "action:${Settings.ACTION_DATA_USAGE_SETTINGS}",
                      "Bluetooth Settings" to "action:${Settings.ACTION_BLUETOOTH_SETTINGS}",
                      "Connected Devices / Cast" to "action:${Settings.ACTION_CAST_SETTINGS}",
                      "VPN Settings" to "action:${Settings.ACTION_VPN_SETTINGS}",
                      "Sound & Vibration" to "action:${Settings.ACTION_SOUND_SETTINGS}",
                      "Do Not Disturb (DND)" to "action:${Settings.ACTION_ZEN_MODE_PRIORITY_SETTINGS}",
                      "Display Settings" to "action:${Settings.ACTION_DISPLAY_SETTINGS}",
                      "Night Light / Eye Comfort" to "action:${Settings.ACTION_NIGHT_DISPLAY_SETTINGS}",
                      "Battery Saver" to "action:${Settings.ACTION_BATTERY_SAVER_SETTINGS}",
                      "Storage Space" to "action:${Settings.ACTION_INTERNAL_STORAGE_SETTINGS}",
                      "Security & Screen Lock" to "action:${Settings.ACTION_SECURITY_SETTINGS}",
                      "Privacy Settings" to "action:${Settings.ACTION_PRIVACY_SETTINGS}",
                      "Location / GPS" to "action:${Settings.ACTION_LOCATION_SOURCE_SETTINGS}",
                      "Developer Options" to "action:${Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS}",
                      "Accessibility Settings" to "action:${Settings.ACTION_ACCESSIBILITY_SETTINGS}",
                      "Date & Time" to "action:${Settings.ACTION_DATE_SETTINGS}",
                      "Language & Input" to "action:${Settings.ACTION_LOCALE_SETTINGS}",
                      "Keyboards" to "action:${Settings.ACTION_INPUT_METHOD_SETTINGS}",
                      "About Phone" to "action:${Settings.ACTION_DEVICE_INFO_SETTINGS}"
                  )

                  for ((label, uri) in standardActions) {
                      availableTargets.add(SettingTarget(label, uri))
                  }

                  // Also scan device-specific exported activities (Xiaomi/Samsung/Realme/Vivo App Manager etc.)
                  try {
                      val pkgInfo = packageManager.getPackageInfo(
                          "com.android.settings",
                          PackageManager.GET_ACTIVITIES
                      )
                      val activities = pkgInfo.activities ?: emptyArray()
                      for (act in activities) {
                          if (act.exported && (act.permission == null || act.permission.isEmpty())) {
                              val rawLabel = act.loadLabel(packageManager)?.toString()?.trim() ?: ""
                              val shortClass = act.name.substringAfterLast(".").substringAfterLast("$")
                              val displayLabel = if (rawLabel.isNotEmpty() && rawLabel != "Settings") {
                                  "Deep: $rawLabel ($shortClass)"
                              } else {
                                  "Deep: $shortClass"
                              }
                              availableTargets.add(
                                  SettingTarget(
                                      label = displayLabel,
                                      targetUri = "comp:${act.packageName}/${act.name}"
                                  )
                              )
                          }
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun openAppManagerDirectly(context: Context) {
                  // Try MANAGE_ALL_APPLICATIONS_SETTINGS first (goes directly into App Manager list skipping the intermediate Apps screen)
                  try {
                      val intent = Intent(Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      context.startActivity(intent)
                      return
                  } catch (_: Exception) {}

                  // Fallback to ACTION_APPLICATION_SETTINGS
                  try {
                      val intent = Intent(Settings.ACTION_APPLICATION_SETTINGS).apply {
                          flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                      }
                      context.startActivity(intent)
                  } catch (e: Exception) {
                      Toast.makeText(context, "Could not open App Manager", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun launchSettingByUri(context: Context, targetUri: String) {
                  if (targetUri == "action:${Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS}") {
                      openAppManagerDirectly(context)
                      return
                  }

                  try {
                      val launchIntent = if (targetUri.startsWith("comp:")) {
                          val compStr = targetUri.removePrefix("comp:")
                          val parts = compStr.split("/")
                          Intent(Intent.ACTION_MAIN).apply {
                              component = ComponentName(parts[0], parts[1])
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                      } else {
                          val actionStr = targetUri.removePrefix("action:")
                          Intent(actionStr).apply {
                              flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                          }
                      }
                      context.startActivity(launchIntent)
                  } catch (e: Exception) {
                      Toast.makeText(context, "Cannot open this screen directly on your phone", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun refreshList() {
                  listContainer.removeAllViews()
                  for (item in bookmarks) {
                      val card = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          setPadding(30, 30, 30, 30)
                          setBackgroundColor(Color.parseColor("#F2F2F7"))
                          val params = LinearLayout.LayoutParams(
                              LinearLayout.LayoutParams.MATCH_PARENT,
                              LinearLayout.LayoutParams.WRAP_CONTENT
                          )
                          params.setMargins(0, 0, 0, 24)
                          layoutParams = params
                      }

                      val titleView = TextView(this).apply {
                          text = item.title
                          textSize = 18f
                          setTypeface(null, Typeface.BOLD)
                          setTextColor(Color.BLACK)
                      }
                      card.addView(titleView)

                      val subView = TextView(this).apply {
                          text = "Target: ${item.targetLabel}"
                          textSize = 13f
                          setTextColor(Color.DKGRAY)
                      }
                      card.addView(subView)

                      val btnRow = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.START
                      }

                      val openBtn = Button(this).apply {
                          text = "Open Now"
                          setOnClickListener {
                              launchSettingByUri(this@MainActivity, item.targetUri)
                          }
                      }
                      btnRow.addView(openBtn)

                      val pinBtn = Button(this).apply {
                          text = "Pin to Home"
                          setOnClickListener {
                              pinBookmarkToHomeScreen(this@MainActivity, item)
                          }
                      }
                      btnRow.addView(pinBtn)

                      val delBtn = Button(this).apply {
                          text = "Delete"
                          setOnClickListener {
                              bookmarks.remove(item)
                              saveAllBookmarks()
                              refreshList()
                          }
                      }
                      btnRow.addView(delBtn)

                      card.addView(btnRow)
                      listContainer.addView(card)
                  }
              }

              private fun saveAllBookmarks() {
                  val prefs = getSharedPreferences("bm_v4_store", Context.MODE_PRIVATE)
                  val serialized = bookmarks.joinToString("####") { bm ->
                      "${bm.id};;${bm.title};;${bm.targetLabel};;${bm.targetUri}"
                  }
                  prefs.edit().putString("saved_list", serialized).apply()
              }

              private fun loadBookmarks() {
                  val prefs = getSharedPreferences("bm_v4_store", Context.MODE_PRIVATE)
                  val saved = prefs.getString("saved_list", null)
                  bookmarks.clear()

                  if (saved == null) {
                      bookmarks.addAll(
                          listOf(
                              SettingBookmark(
                                  "app_mgr",
                                  "App Manager (All Apps)",
                                  "Apps -> App Manager (Manage All Apps)",
                                  "action:${Settings.ACTION_MANAGE_ALL_APPLICATIONS_SETTINGS}"
                              ),
                              SettingBookmark(
                                  "default_apps",
                                  "Default Apps",
                                  "Apps -> Default Apps (Browser, Phone)",
                                  "action:${Settings.ACTION_MANAGE_DEFAULT_APPS_SETTINGS}"
                              ),
                              SettingBookmark(
                                  "dev_options",
                                  "Developer Options",
                                  "Developer Options",
                                  "action:${Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS}"
                              ),
                              SettingBookmark(
                                  "wifi_settings",
                                  "Wi-Fi Settings",
                                  "Wi-Fi Settings",
                                  "action:${Settings.ACTION_WIFI_SETTINGS}"
                              )
                          )
                      )
                      saveAllBookmarks()
                  } else if (saved.isNotEmpty()) {
                      for (entry in saved.split("####")) {
                          val parts = entry.split(";;")
                          if (parts.size == 4) {
                              bookmarks.add(SettingBookmark(parts[0], parts[1], parts[2], parts[3]))
                          }
                      }
                  }
              }

              private fun pinBookmarkToHomeScreen(context: Context, bookmark: SettingBookmark) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sm = context.getSystemService(ShortcutManager::class.java)
                      if (sm != null && sm.isRequestPinShortcutSupported) {
                          // Using a unique URI in data guarantees Android never merges or overwrites shortcuts!
                          val uniqueUri = Uri.parse("settingsbm://open/${bookmark.id}?target=${Uri.encode(bookmark.targetUri)}")
                          val shortcutIntent = Intent(Intent.ACTION_VIEW, uniqueUri, context, MainActivity::class.java)

                          val info = ShortcutInfo.Builder(context, "${bookmark.id}_${System.currentTimeMillis()}")
                              .setShortLabel(bookmark.title)
                              .setLongLabel("Open ${bookmark.title}")
                              .setIcon(Icon.createWithResource(context, android.R.drawable.ic_menu_preferences))
                              .setIntent(shortcutIntent)
                              .build()

                          val cb = sm.createShortcutResultIntent(info)
                          val pending = PendingIntent.getBroadcast(
                              context,
                              System.currentTimeMillis().toInt(),
                              cb,
                              PendingIntent.FLAG_IMMUTABLE
                          )
                          sm.requestPinShortcut(info, pending.intentSender)
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsBookmarker-V4-APK
          path: app/build/outputs/apk/debug/app-debug.apk
