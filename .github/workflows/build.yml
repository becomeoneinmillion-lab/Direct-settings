name: Auto-Generate and Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project Files
        run: |
          mkdir -p app/src/main/java/com/example/settingsbookmarker
          mkdir -p app/src/main/res/xml

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "SettingsBookmarker"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.settingsbookmarker"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.settingsbookmarker"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.10"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.02.00"))
              implementation("androidx.activity:activity-compose:1.8.2")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.settingsbookmarker">

              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <uses-permission android:name="android.permission.WRITE_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:label="Settings Bookmarker"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="com.example.settingsbookmarker.OPEN_BOOKMARK" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".SettingsNavigatorService"
                      android:exported="false"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>

              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged|typeWindowContentChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canPerformGestures="true"
              android:canRetrieveWindowContent="true"
              android:notificationTimeout="50"
              android:packageNames="com.android.settings" />
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/SettingsNavigatorService.kt
          package com.example.settingsbookmarker

          import android.accessibilityservice.AccessibilityService
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo
          import java.util.LinkedList
          import java.util.Queue

          class SettingsNavigatorService : AccessibilityService() {

              companion object {
                  val clickQueue: Queue<String> = LinkedList()
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (clickQueue.isEmpty()) return
                  val rootNode = rootInActiveWindow ?: return
                  val targetText = clickQueue.peek() ?: return

                  val matchingNodes = rootNode.findAccessibilityNodeInfosByText(targetText)
                  if (!matchingNodes.isNullOrEmpty()) {
                      for (node in matchingNodes) {
                          val clickableParent = findClickableParent(node)
                          if (clickableParent != null) {
                              clickQueue.poll()
                              clickableParent.performAction(AccessibilityNodeInfo.ACTION_CLICK)
                              return
                          }
                      }
                  } else {
                      scrollDown(rootNode)
                  }
              }

              private fun findClickableParent(node: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  var current = node
                  while (current != null) {
                      if (current.isClickable) return current
                      current = current.parent
                  }
                  return null
              }

              private fun scrollDown(node: AccessibilityNodeInfo?) {
                  if (node == null) return
                  if (node.isScrollable) {
                      node.performAction(AccessibilityNodeInfo.ACTION_SCROLL_FORWARD)
                      return
                  }
                  for (i in 0 until node.childCount) {
                      scrollDown(node.getChild(i))
                  }
              }

              override fun onInterrupt() {
                  clickQueue.clear()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/settingsbookmarker/MainActivity.kt
          package com.example.settingsbookmarker

          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ShortcutInfo
          import android.content.pm.ShortcutManager
          import android.graphics.drawable.Icon
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.unit.dp

          data class SettingBookmark(
              val id: String,
              val title: String,
              val baseAction: String,
              val subSteps: List<String> = emptyList()
          )

          class MainActivity : ComponentActivity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  if (intent?.action == "com.example.settingsbookmarker.OPEN_BOOKMARK") {
                      val baseAction = intent.getStringExtra("BASE_ACTION") ?: Settings.ACTION_SETTINGS
                      val stepsString = intent.getStringExtra("SUB_STEPS") ?: ""
                      val steps = if (stepsString.isNotEmpty()) stepsString.split("|") else emptyList()

                      executeBookmark(this, baseAction, steps)
                      finish()
                      return
                  }

                  setContent {
                      MaterialTheme {
                          Surface(modifier = Modifier.fillMaxSize()) {
                              BookmarkScreen()
                          }
                      }
                  }
              }
          }

          fun executeBookmark(context: Context, baseAction: String, subSteps: List<String>) {
              SettingsNavigatorService.clickQueue.clear()
              SettingsNavigatorService.clickQueue.addAll(subSteps)

              val intent = Intent(baseAction).apply {
                  flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TASK
              }
              try {
                  context.startActivity(intent)
              } catch (e: Exception) {
                  Toast.makeText(context, "Setting not supported on this device", Toast.LENGTH_SHORT).show()
              }
          }

          fun pinBookmarkToHomeScreen(context: Context, bookmark: SettingBookmark) {
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                  val shortcutManager = context.getSystemService(ShortcutManager::class.java)
                  if (shortcutManager != null && shortcutManager.isRequestPinShortcutSupported) {
                      val shortcutIntent = Intent(context, MainActivity::class.java).apply {
                          action = "com.example.settingsbookmarker.OPEN_BOOKMARK"
                          putExtra("BASE_ACTION", bookmark.baseAction)
                          putExtra("SUB_STEPS", bookmark.subSteps.joinToString("|"))
                      }

                      val shortcutInfo = ShortcutInfo.Builder(context, bookmark.id)
                          .setShortLabel(bookmark.title)
                          .setLongLabel("Open ${bookmark.title}")
                          .setIcon(Icon.createWithResource(context, android.R.drawable.ic_menu_preferences))
                          .setIntent(shortcutIntent)
                          .build()

                      val pinnedShortcutCallbackIntent = shortcutManager.createShortcutResultIntent(shortcutInfo)
                      val successCallback = PendingIntent.getBroadcast(
                          context, 0, pinnedShortcutCallbackIntent, PendingIntent.FLAG_IMMUTABLE
                      )

                      shortcutManager.requestPinShortcut(shortcutInfo, successCallback.intentSender)
                  }
              }
          }

          @Composable
          fun BookmarkScreen() {
              val context = LocalContext.current

              val bookmarks = remember {
                  mutableStateListOf(
                      SettingBookmark(
                          id = "display_direct",
                          title = "Display Settings (Direct)",
                          baseAction = Settings.ACTION_DISPLAY_SETTINGS
                      ),
                      SettingBookmark(
                          id = "refresh_rate_deep",
                          title = "Screen Refresh Rate (Deep Step)",
                          baseAction = Settings.ACTION_DISPLAY_SETTINGS,
                          subSteps = listOf("Smooth Display")
                      ),
                      SettingBookmark(
                          id = "dev_options",
                          title = "Developer Options",
                          baseAction = Settings.ACTION_APPLICATION_DEVELOPMENT_SETTINGS
                      ),
                      SettingBookmark(
                          id = "battery_saver",
                          title = "Battery Saver",
                          baseAction = Settings.ACTION_BATTERY_SAVER_SETTINGS
                      ),
                      SettingBookmark(
                          id = "wifi_settings",
                          title = "Wi-Fi Settings",
                          baseAction = Settings.ACTION_WIFI_SETTINGS
                      )
                  )
              }

              var customTitle by remember { mutableStateOf("") }
              var customStep by remember { mutableStateOf("") }

              Column(modifier = Modifier.padding(16.dp)) {
                  Text("Settings Bookmarker", style = MaterialTheme.typography.headlineSmall)
                  Spacer(modifier = Modifier.height(8.dp))

                  Button(
                      onClick = {
                          context.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("1. Enable Accessibility Service (For Deep Steps)")
                  }

                  Spacer(modifier = Modifier.height(12.dp))

                  OutlinedTextField(
                      value = customTitle,
                      onValueChange = { customTitle = it },
                      label = { Text("Bookmark Name (e.g., Dark Mode Schedule)") },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))
                  OutlinedTextField(
                      value = customStep,
                      onValueChange = { customStep = it },
                      label = { Text("Exact Menu Text to Auto-Click (comma separated)") },
                      placeholder = { Text("e.g., Dark theme, Schedule") },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(modifier = Modifier.height(8.dp))
                  Button(
                      onClick = {
                          if (customTitle.isNotBlank() && customStep.isNotBlank()) {
                              bookmarks.add(
                                  SettingBookmark(
                                      id = "custom_${System.currentTimeMillis()}",
                                      title = customTitle,
                                      baseAction = Settings.ACTION_DISPLAY_SETTINGS,
                                      subSteps = customStep.split(",").map { it.trim() }
                                  )
                              )
                              customTitle = ""
                              customStep = ""
                          }
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("Add Custom Display Sub-Setting Bookmark")
                  }

                  Spacer(modifier = Modifier.height(16.dp))
                  Text("Saved Bookmarks:", style = MaterialTheme.typography.titleMedium)

                  LazyColumn(modifier = Modifier.fillMaxSize()) {
                      items(bookmarks) { item ->
                          Card(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .padding(vertical = 6.dp)
                          ) {
                              Column(modifier = Modifier.padding(12.dp)) {
                                  Text(item.title, style = MaterialTheme.typography.titleMedium)
                                  if (item.subSteps.isNotEmpty()) {
                                      Text(
                                          "Auto-clicks: ${item.subSteps.joinToString(" -> ")}",
                                          style = MaterialTheme.typography.bodySmall
                                      )
                                  }
                                  Spacer(modifier = Modifier.height(8.dp))
                                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                      Button(onClick = {
                                          executeBookmark(context, item.baseAction, item.subSteps)
                                      }) {
                                          Text("Open Now")
                                      }
                                      OutlinedButton(onClick = {
                                          pinBookmarkToHomeScreen(context, item)
                                      }) {
                                          Text("Pin to Home")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SettingsBookmarker-APK
          path: app/build/outputs/apk/debug/app-debug.apk
